# Modelos candidatos — benchmark Top 10 (AWQ + FP8 + GGUF)
# Estrategia: embudo 2 fases (smoke 30-50 muestras, descartar <70% y borrar antes del siguiente)
# Fuente ranking: docs/benchmark_modelos/ranking_combinado.md (31-ago-2026)

infra:
  gpu: "RTX 4070 Ti SUPER 16GB"
  driver: "615.71.09"
  cuda_toolkit: "13.4"
  vllm: "0.29.0 (venv /root/vllm-env, torch 2.13 cu130)"
  llama_server: "build desde source commit 6d9c82e (09-sep-2026, CUDA sm_89) en /root/llama.cpp-src/build/bin/"
  # PUERTOS: llama-server=1234, vLLM serve=8000. REGLA: solo uno corre por vez (16GB VRAM).
  # NOTA vLLM 0.29: no pasar quantization= explicito (auto marlin). Scripts con awq_marlin fijo hay que adaptarlos.

fixtures_smoke: # modelos livianos de validacion de infra (se quedan)
  - id: "Qwen/Qwen2.5-0.5B-Instruct-AWQ"
    formato: AWQ
    path: "/root/.cache/huggingface/hub/models--Qwen--Qwen2.5-0.5B-Instruct-AWQ"
    size: "708M"
    resultado: "OK vLLM 0.29 (LOAD 63.5s primera vez, GEN 0.25s, 'capital es Asunción')"
  - id: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:qwen2.5-0.5b-instruct-q4_k_m.gguf"
    formato: GGUF
    path: "./models/gguf/qwen2.5-0.5b-instruct-q4_k_m.gguf"
    size: "469M"
    resultado: "OK llama-server (UP 2s, VRAM 682MiB total, 'La capital de Paraguay es Asunción')"

# Tanda 0 — baselines (se quedan, 9.3 GB)
